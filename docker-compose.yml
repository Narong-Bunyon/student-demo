
services:
  # Laravel application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-demo-app:latest
    container_name: student_demo_app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8000}:80"

    environment:
      APP_NAME: "${APP_NAME:-Student Demo}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-student_demo}"
      DB_USERNAME: "${DB_USERNAME:-student_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - student_demo_network

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: student_demo_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-student_demo}"
      MYSQL_USER: "${DB_USERNAME:-student_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - student_demo_network

    # No public database port is exposed.
    # Laravel connects internally through the mysql service.

networks:
  student_demo_network:
    driver: bridge

volumes:
  mysql_data:
    name: student_demo_mysql_data
